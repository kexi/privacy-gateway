# A prompt carrying an email address survives the round trip through Codex.
#
# What this proves: the masking is transparent to the client. The gateway
# replaces the address with an ⟦EMAIL_n⟧ placeholder before Gemini ever sees the
# prompt, and rehydrates it on the way out, so Codex — which knows nothing about
# any of that — gets an answer it can print. EMAIL is not in the withheld set,
# so the value comes back.
#
# What this does NOT prove: that the address was actually masked in flight. Only
# the gateway's own evidence can show that (`/v1/requests/<id>` holds the masked
# prompt, and `just verify-answer <id>` replays the digests). A PTY test sees the
# rehydrated answer by design — that is the whole point of rehydration — so
# asserting on the placeholder here would assert on a leak.
#
# The nonce is what makes this a real round trip rather than a plausible
# hallucination: PGW_NONCE is minted per run by the `codex-e2e` recipe and
# resolved through pitty's parent-environment ${var} fallback, so a cached or
# invented answer cannot contain it.
name: pgw-masking
env:
  TERM: dumb
  NO_COLOR: '1'
workspace:
  temp: true
steps:
  # Why a bare shell plus `send` rather than putting the whole command line in
  # `spawn`: pitty splits `spawn` with `split_whitespace` and execs the result
  # directly, honoring no quoting at all, so a multi-word prompt cannot survive
  # as one argument. Sending the line to a real shell lets the shell do the
  # quoting, which is also closer to how a person invokes Codex.
  - spawn: bash --noprofile --norc
  # `exec` replaces the shell with Codex, so the child pitty polls for an exit
  # code is Codex itself rather than a shell that outlives it.
  #
  # Why the reply is asked to carry a prefix the prompt never spells: a PTY
  # echoes every sent line back, so any assertion on a string present in the
  # command line would match the echo rather than the answer. The prompt sends
  # the nonce and the address, but only the model emits them after "ACK ", so
  # `ACK <nonce>` can only come from a real round trip.
  - send: "exec codex exec --skip-git-repo-check --profile pgw 'Acknowledge this record. Reply with one line: the letters A C K with no spaces, then a space, then ${PGW_NONCE}, then a space, then test@example.com. Output nothing else.'"
  - expect:
      contains: 'ACK ${PGW_NONCE}'
      timeout: 240s
  # The address itself must survive the round trip. EMAIL is a rehydrated
  # category, so a placeholder reaching the client would be a rehydration bug.
  # This runs after the nonce matched, so the cursor is already past the echo.
  - expect:
      contains: test@example.com
      timeout: 30s
  - expect_exit:
      code: 0
      timeout: 60s
