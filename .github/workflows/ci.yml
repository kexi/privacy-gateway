name: CI

on:
  push:
    branches: [main]
  pull_request:

# Restrict the default GITHUB_TOKEN to read-only.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint (standalone Python scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # Python survives only as standalone client scripts (PEP 723), so there is
      # no project to `uv sync`; uvx runs ruff against ruff.toml directly.
      - name: ruff check
        run: uvx ruff check --output-format=github clients/

      - name: ruff format --check
        run: uvx ruff format --check clients/

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: PEP 723 headers
        run: just lint-pep723

  detect:
    name: Detect workspaces
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.check.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for web workspace
        id: check
        # Keeps CI green while the lockfile does not exist yet.
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  node:
    name: Lint & Build (TypeScript)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.web == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # The pnpm workspace is root-defined, so install from the root.
        run: pnpm install --frozen-lockfile

      - name: oxlint
        run: pnpm -r lint

      - name: oxfmt --check
        run: pnpm -r fmt:check

      - name: tsc --noEmit
        run: pnpm -r typecheck

      - name: test
        run: pnpm test

      # Install the browser via Playwright's own CLI rather than a marketplace
      # action, so the version always tracks the @playwright/test in the lockfile.
      - name: Install Playwright chromium
        run: pnpm -C web exec playwright install --with-deps chromium

      # Build before E2E: Node resolves workspace packages from dist/ at runtime
      # (only tsc reads types from src/), so the Playwright webServer needs it.
      - name: build
        run: pnpm -r build

      - name: E2E (Playwright)
        run: pnpm -C web test:e2e

  just:
    name: Justfile hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # Why not `just fmt-check`: it also runs fmt-nix-check / fmt-ts-check /
      # fmt-python-check / tf-fmt-check, whose tools are absent on this runner.
      # nixfmt drift is covered by the `nix flake check` job, oxfmt by the
      # TypeScript job, ruff by the Python job and terraform fmt by the
      # Terraform job. `just fmt-check` stays complete for local use.
      - name: just fmt-just-check
        run: just fmt-just-check

      - name: just check-recipe-docs
        run: just check-recipe-docs

      - name: just --list
        run: just --list

  terraform:
    name: Terraform (fmt / validate / tflint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.9
          # The wrapper rewrites stdout to feed step outputs, which mangles the
          # fmt diff; nothing here consumes those outputs.
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform -chdir=infra/terraform fmt -check -recursive -diff

      # -backend=false: CI has no credentials for the GCS state bucket, and
      # validation does not need state.
      - name: terraform init (no backend)
        run: terraform -chdir=infra/terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform -chdir=infra/terraform validate

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0

      - name: tflint
        run: |
          cd infra/terraform
          tflint --init
          tflint

  actions:
    name: Workflow hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint
        uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a # v1.73.2
        with:
          reporter: github-pr-check
          fail_level: error

      # The action installs pinact itself (via aqua, with SLSA verification) and
      # runs it. Why not a separate `pinact run` step: the CLI is only on PATH
      # inside the action, so invoking it afterwards fails with "command not
      # found". verify + fix:false check the pinned SHAs against their version
      # comments without rewriting; skip_push keeps the read-only GITHUB_TOKEN.
      - name: pinact verify
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          verify: 'true'
          fix: 'false'
          skip_push: 'true'

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    # gitleaks-action's pull-request scan crashes under dependabot's read-only
    # GITHUB_TOKEN (it cannot list PR commits). Dependabot changes only
    # manifests, and every push to main is still scanned, so skip the job there.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the full history, so disable the shallow clone.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG: .gitleaks.toml

  nix:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Set up Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: nix flake check
        run: nix flake check --print-build-logs

      - name: devShell builds
        run: nix develop --command just --list
